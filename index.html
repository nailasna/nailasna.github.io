<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naila</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  /* ====== GANTI WARNA DI SINI ====== */
  :root {
    --blue: #8ec5ff;
    --blue-dark: #3f7fd1;
    --pink: #ff9ec7;
    --pink-dark: #e0509a;
    --text: #4a4a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, #d6ebff 0%, #eadcff 50%, #ffd9ea 100%);
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    overflow: hidden; position: relative;
  }

  /* bintang kecil-kecil */
  .star {
    position: fixed; z-index: 0; pointer-events: none;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .avatar {
    width: 200px; height: 200px; border-radius: 50%;
    background: #fff;
    border: 8px solid transparent;
    background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, var(--blue), var(--pink));
    background-origin: border-box; background-clip: padding-box, border-box;
    display: grid; place-items: center;
    font-size: 100px; cursor: pointer; user-select: none;
    transition: transform .2s; position: relative; z-index: 2;
  }
  .avatar:active { transform: scale(.9) rotate(6deg); }

  h1 {
    margin-top: 40px; font-family: "Pacifico", cursive; font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1.3;
    background: linear-gradient(90deg, var(--blue-dark), var(--pink-dark));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    position: relative; z-index: 2;
  }
  .typing { margin-top: 10px; font-size: clamp(1.1rem, 3vw, 1.5rem); min-height: 1.6em; position: relative; z-index: 2; }
  .typing::after { content: "|"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .btn {
    margin-top: 32px; padding: 14px 38px; border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--pink));
    color: #fff; text-decoration: none; font-size: 1.3rem; font-weight: 600;
    position: relative; z-index: 2; transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 18px rgba(143, 160, 255, .45);
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(224, 80, 154, .35); }
  .btn:focus-visible, .avatar:focus-visible { outline: 3px solid var(--blue-dark); outline-offset: 4px; }
  .hint { margin-top: 24px; opacity: .65; position: relative; z-index: 2; }

  .garden {
    position: fixed; left: 0; right: 0; bottom: -6px; z-index: 1;
    display: flex; justify-content: space-around; align-items: flex-end;
    pointer-events: none;
  }
  .garden span {
    font-size: clamp(34px, 6vw, 60px);
    transform-origin: bottom center;
    animation: sway 3.5s ease-in-out infinite;
  }
  @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  .pop {
    position: fixed; z-index: 3; pointer-events: none;
    animation: pop 1.6s ease-out forwards;
  }
  @keyframes pop {
    0% { transform: translate(0, 0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1.3) rotate(40deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .garden span, .typing::after { animation: none; }
    .pop { display: none; }
  }
</style>
</head>
<body>

  <div class="avatar" id="logo" role="button" tabindex="0" aria-label="Klik tulip">🌷</div>

  <!-- GANTI NAMA DI SINI -->
  <h1>Hai, aku Naila</h1>

  <!-- GANTI KALIMAT DI SINI -->
  <p class="typing" id="typing"></p>

  <a class="btn" href="https://github.com/nailasna" target="_blank" rel="noopener">GitHub</a>

  <p class="hint">Klik tulipnya 🌷</p>

  <div class="garden" aria-hidden="true">
    <span>🌷</span><span style="animation-delay:-1s">🌷</span><span style="animation-delay:-2s">🌷</span>
    <span style="animation-delay:-.5s">🌷</span><span style="animation-delay:-1.5s">🌷</span><span style="animation-delay:-2.5s">🌷</span>
    <span style="animation-delay:-.8s">🌷</span><span style="animation-delay:-1.8s">🌷</span>
  </div>

<script>
  // 1. Efek mengetik
  const kalimat = "Blooming in my own time.";
  const el = document.getElementById("typing");
  let i = 0;
  (function ketik() {
    if (i <= kalimat.length) { el.textContent = kalimat.slice(0, i++); setTimeout(ketik, 90); }
  })();

  // 2. Bintang kecil berkelap-kelip
  const warna = ["#ffffff", "#8ec5ff", "#ff9ec7", "#ffe28a"];
  for (let n = 0; n < 45; n++) {
    const s = document.createElement("span");
    s.className = "star";
    s.textContent = "✦";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.fontSize = 8 + Math.random() * 14 + "px";
    s.style.color = warna[Math.floor(Math.random() * warna.length)];
    s.style.animationDuration = 2 + Math.random() * 3 + "s";
    s.style.animationDelay = -Math.random() * 4 + "s";
    document.body.appendChild(s);
  }

  // 3. Klik tulip = ledakan tulip & bintang
  const logo = document.getElementById("logo");
  function letus() {
    const r = logo.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const isi = ["🌷", "✦", "⭐", "🌷", "✨"];
    for (let n = 0; n < 16; n++) {
      const p = document.createElement("span");
      p.className = "pop";
      p.textContent = isi[n % isi.length];
      const sudut = (Math.PI * 2 * n) / 16, jarak = 120 + Math.random() * 120;
      p.style.left = cx + "px"; p.style.top = cy + "px";
      p.style.fontSize = 18 + Math.random() * 18 + "px";
      p.style.setProperty("--x", Math.cos(sudut) * jarak + "px");
      p.style.setProperty("--y", Math.sin(sudut) * jarak + "px");
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1700);
    }
  }
  logo.addEventListener("click", letus);
  logo.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") letus(); });
</script>
</body>
</html>
